<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Морской бой: Лоция</title>
<link rel="icon" href="assets/icon/app_icon_192.png">
<style>
:root{
  --paper:#EFE3C8; --ink:#3B2A1A; --ink2:#5a4630; --sea:#3E7C86; --brass:#B8893B; --hit:#B3261E; --green:#4F8A3C;
  --b: min(42vw, calc(var(--vh,100vh) - 190px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#1d1610;color:var(--ink);
  font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,"Times New Roman",serif;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;background-size:cover;background-position:center}
.screen.on{display:block}
button{font-family:inherit;cursor:pointer}
.btn{position:relative;border:solid transparent;border-width:14px 22px;padding:.2em .6em;font-size:clamp(15px,1.9vw,22px);font-weight:bold;
  color:var(--ink);letter-spacing:.03em;background:none;
  border-image:url(assets/ui/btn_normal.png) 62 110 fill / 14px 22px stretch;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.35));text-shadow:0 1px 0 rgba(255,255,255,.55);
  transition:transform .08s, filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(3px);border-image-source:url(assets/ui/btn_pressed.png);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.btn:disabled{border-image-source:url(assets/ui/btn_disabled.png);color:#6f6a62;cursor:default;transform:none;filter:none}
.btn.small{font-size:clamp(13px,1.4vw,17px);padding:.15em .4em}
.btn.red{color:#8a1d16}
.panel{background:rgba(244,232,205,.93);border:2px solid #8a6a2e;border-radius:12px;
  box-shadow:inset 0 0 0 4px rgba(184,137,59,.35),0 10px 30px rgba(0,0,0,.4);padding:16px 20px}
h1,h2,h3{margin:0;font-weight:bold}

/* ---------- intro ---------- */
#intro{background:#0f1226;overflow:hidden;cursor:pointer;z-index:100;transition:opacity .5s}
#intro video,#intro img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;background:#0f1226}
#intro img{animation:spIn .8s ease-out both}
@keyframes spIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
#intro .skip{position:absolute;bottom:14px;right:18px;color:rgba(255,255,255,.4);font:14px sans-serif}
#intro.out{opacity:0;pointer-events:none}
@keyframes fadeIn{to{opacity:1}}

/* ---------- пролог (вступительный ролик) ---------- */
#prologue{background:#05070c;overflow:hidden;z-index:95;cursor:pointer}
.pl-scene{position:absolute;inset:0;opacity:0;overflow:hidden;will-change:opacity}
.pl-cam{position:absolute;left:50%;top:50%;transform-origin:50% 50%;will-change:transform}
.pl-cam>img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pl-ov{position:absolute;pointer-events:none}
.pl-fog{position:absolute;left:-30%;top:-10%;width:160%;height:120%;pointer-events:none;mix-blend-mode:screen;opacity:.55;filter:blur(18px);
  background:
   radial-gradient(28% 18% at 12% 62%,rgba(205,222,226,.65),transparent 70%),
   radial-gradient(22% 14% at 34% 48%,rgba(190,210,216,.5),transparent 70%),
   radial-gradient(30% 20% at 58% 70%,rgba(214,228,232,.6),transparent 70%),
   radial-gradient(24% 16% at 80% 52%,rgba(190,208,214,.5),transparent 70%),
   radial-gradient(34% 22% at 96% 74%,rgba(210,224,228,.55),transparent 70%)}
.pl-fog.f2{opacity:.4;top:-25%;transform:scaleY(-1)}
.pl-dark{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,rgba(5,7,12,.35),rgba(5,7,12,.85));opacity:0;pointer-events:none}
.pl-meds{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:min(1.6vw,16px);align-items:center}
.pl-meds img{width:min(9vw,104px);height:min(9vw,104px);border-radius:50%;object-fit:cover;border:3px solid #b8893b;box-shadow:0 0 0 2px #3b2a1a,0 8px 18px rgba(0,0,0,.6);opacity:0;transform:scale(.4)}
.pl-meds img.boss{width:min(13vw,150px);height:min(13vw,150px);border-color:#8f1d16;box-shadow:0 0 0 2px #2a0806,0 0 26px 6px rgba(179,38,30,.75)}
.pl-glow{border-radius:50%;background:radial-gradient(circle,rgba(255,210,120,.75),rgba(255,170,60,.25) 40%,transparent 70%);mix-blend-mode:screen}
.pl-flash{border-radius:50%;background:radial-gradient(circle,rgba(255,250,220,1),rgba(255,190,80,.7) 30%,rgba(255,120,30,0) 70%);mix-blend-mode:screen;opacity:0}
.pl-fx{background-repeat:no-repeat}
.pl-unroll{position:absolute;top:0;bottom:0;width:4%;background:linear-gradient(90deg,rgba(60,40,20,0),rgba(60,40,20,.55) 45%,#e9dbbb 55%,#cdb88e 80%,rgba(60,40,20,.4));pointer-events:none;filter:drop-shadow(-6px 0 10px rgba(0,0,0,.45))}
.pl-ship{will-change:transform}
.pl-ship img{width:100%;display:block;filter:drop-shadow(0 6px 4px rgba(30,40,50,.25))}
.pl-wake{border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.75),rgba(255,255,255,0) 70%);filter:blur(4px)}
.pl-gull{width:2.2%;height:auto}
.pl-gull path{fill:none;stroke:#3b2a1a;stroke-width:2.2;stroke-linecap:round}
.pl-logo{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.pl-logo img{width:min(64vw,70vh,760px);filter:drop-shadow(0 10px 20px rgba(0,0,0,.6))}
.pl-logo .t2{font-size:clamp(18px,3vw,38px);letter-spacing:.5em;color:#cfe4e2;font-style:italic;text-shadow:0 2px 8px rgba(0,0,0,.8)}
.pl-compass{position:absolute;left:50%;top:50%;width:min(80vh,80vw);height:min(80vh,80vw);transform:translate(-50%,-50%);opacity:.18}
.pl-cap{position:absolute;z-index:4;left:0;right:0;bottom:0;height:11vh;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;column-gap:.28em;text-align:center;padding:0 6vw;pointer-events:none;
  font-size:clamp(16px,2.3vw,30px);line-height:1.25;color:#f6ead0;font-style:italic;text-shadow:0 2px 3px #000,0 0 18px rgba(0,0,0,.9);opacity:0;transition:opacity .7s}
.pl-cap.on{opacity:1}
.pl-cap span{display:inline-block;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.pl-cap.on span{opacity:1;transform:none}
.pl-band{position:absolute;left:0;right:0;height:11vh;background:#05070c;pointer-events:none;z-index:3}
.pl-band.top{top:0}.pl-band.bot{bottom:0}
.pl-vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55));z-index:2}
.pl-hint{position:absolute;right:18px;bottom:14px;color:rgba(255,255,255,.45);font:14px sans-serif;z-index:4}
.pl-go{position:absolute;left:0;right:0;bottom:3.5vh;text-align:center;color:#f6ead0;font-size:clamp(16px,2vw,24px);letter-spacing:.08em;opacity:0;z-index:4;text-shadow:0 2px 6px #000}
.pl-go.on{animation:plPulse 1.6s ease-in-out infinite}
@keyframes plPulse{0%,100%{opacity:.35}50%{opacity:1}}
.mlink{font:inherit;font-size:13px;background:none;border:none;color:var(--ink2);text-decoration:underline;cursor:pointer;padding:2px 6px}
@media (max-aspect-ratio:1/1){ .pl-band{height:14vh} .pl-cap{height:14vh;font-size:18px} .pl-meds{gap:4px} .pl-meds img{width:10vw;height:10vw} .pl-meds img.boss{width:14vw;height:14vw} }

/* ---------- menu ---------- */
#menu{background-image:url(assets/bg/menu.jpg)}
#menu .wrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;padding:2vh}
.title{text-align:center;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.5)}
.title .t1{font-size:clamp(30px,6vw,74px);letter-spacing:.06em;line-height:1}
.title .logo{width:min(44vw,62vh,560px);display:block;margin:0 auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.title .t2{font-size:clamp(18px,2.6vw,32px);letter-spacing:.5em;color:var(--sea);margin-top:.2em;font-style:italic}
.rankbox{display:flex;align-items:center;gap:14px;min-width:min(520px,90vw)}
.rankbox img{width:62px;height:62px;border-radius:8px;object-fit:cover;border:2px solid #8a6a2e}
.rankbox .rname{font-size:clamp(16px,1.9vw,21px);font-weight:bold}
.bar{height:10px;border-radius:6px;background:#d6c39a;border:1px solid #8a6a2e;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#e2b75a)}
.rankbox .pts{font-size:13px;color:var(--ink2);margin-top:4px}
.opp{display:flex;align-items:center;gap:16px;min-width:min(520px,90vw)}
.opp img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--brass);box-shadow:0 3px 10px rgba(0,0,0,.35)}
.opp .lvl{font-size:13px;color:var(--ink2)}
.opp .cname{font-size:clamp(17px,2vw,23px);font-weight:bold}
.opp .arrows{margin-left:auto;display:flex;gap:6px}
.opp .arrows button{width:38px;height:38px;border-radius:50%;border:2px solid #8a6a2e;background:#f1e3c2;font-size:18px;color:var(--ink)}
.menurow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.stats{font-size:13px;color:var(--ink2);text-align:center}
.corner{position:absolute;top:12px;right:12px;z-index:10;display:flex;gap:8px}
.iconbtn.off{opacity:.45}
.iconbtn{background:radial-gradient(circle at 40% 35%,#fbf3df,#e6d3a8)!important;border:2px solid #8a6a2e!important;box-shadow:inset 0 0 0 2px #d9b56a,0 3px 8px rgba(0,0,0,.35);padding:0}
.iconbtn svg{width:62%;height:62%;display:block;margin:auto}
.iconbtn .slash{display:none}.iconbtn.off .slash{display:inline}
/* сгенерированные иконки-иллюминаторы */
.iconbtn.pic{background:none!important;border:none!important;box-shadow:none;width:52px;height:52px;position:relative;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4));transition:transform .12s}
.iconbtn.pic:hover{transform:scale(1.07)}.iconbtn.pic:active{transform:scale(.94)}
.iconbtn.pic img{width:100%;height:100%;display:block;pointer-events:none}
.iconbtn.pic.off{opacity:1}
.iconbtn.pic .i-off{display:none}.iconbtn.pic.off .i-on{display:none}.iconbtn.pic.off .i-off{display:block}
.iconbtn.lang.pic b{position:absolute;right:-4px;bottom:-3px;font-size:11px;line-height:1;padding:3px 5px;border-radius:8px;background:#f4e6c4;border:1.5px solid #8a6a2e;color:var(--ink)}
.ico{width:1.5em;height:1.5em;vertical-align:-.38em;display:inline-block;margin-right:.3em;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
.medal{width:30px;height:auto;display:block;margin:auto;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.iconbtn.pic.xbtn{position:absolute;top:10%;right:9%;width:44px;height:44px;z-index:3}
.iconbtn.pic.xbtn.left{right:auto;left:8%;top:9%}
#leaders .card,.modal .card{position:relative}
/* player chip */
.pchip{position:absolute;top:12px;left:12px;z-index:10;display:flex;align-items:center;gap:12px;padding:6px 14px 6px 6px}
.lvlbadge{--p:0;position:relative;width:54px;height:54px;border-radius:50%;flex:none;
  background:conic-gradient(#e2b75a calc(var(--p)*1%), #d6c39a 0);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.lvlbadge::before{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fbf3df,#e6d3a8);border:2px solid #8a6a2e}
.lvlbadge b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--ink);line-height:1}
.lvlbadge small{position:absolute;left:0;right:0;bottom:7px;text-align:center;font-size:9px;color:var(--ink2);letter-spacing:.05em}
.pinfo{display:flex;flex-direction:column;gap:3px;min-width:0}
.prow{display:flex;align-items:center;gap:6px}
.xptxt{font-size:12px;color:var(--ink2)}
.enbox{display:flex;flex-direction:column;gap:3px;min-width:120px}
.enrow{display:flex;align-items:center;gap:4px;font-weight:bold;color:#2f5f8a;font-size:15px}
.enrow svg{width:18px;height:18px}
.enbar{height:8px;border-radius:5px;background:#d6c39a;border:1px solid #8a6a2e;overflow:hidden}
.enbar i{display:block;height:100%;background:linear-gradient(90deg,#3d7fb8,#7cc3e8);transition:width .4s}
.entimer{font-size:11px;color:var(--ink2);min-height:1em}
.btn .cost{display:inline-flex;align-items:center;gap:2px;font-size:.75em;color:#2f5f8a;margin-left:.4em;vertical-align:.1em}
.btn .cost svg{width:1em;height:1em}
.btn.noen{color:#7d7568}.btn.noen .cost{color:var(--hit)}
#rXp{font-weight:bold;color:#2f5f8a;font-size:17px}
#rFuel{font-weight:bold;color:#6b3f12;font-size:16px;display:flex;align-items:center;gap:6px}#rFuel:empty{display:none}#rFuel img{width:26px;height:26px;border-radius:5px}
.item .pr img{width:15px;height:15px;border-radius:3px;vertical-align:-3px;margin-right:2px}
.pchip .pname{font-weight:bold;font-size:clamp(14px,1.5vw,18px);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip .coins{display:flex;align-items:center;gap:4px;font-weight:bold;color:#7a5a12}
.pchip .coins img{width:26px;height:26px}
.pchip .net{width:9px;height:9px;border-radius:50%;background:#9a8f7a}
.pchip .net.on{background:var(--green)}.pchip .net.err{background:var(--hit)}
.dot-badge{position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--hit);border:2px solid #fff6e0;display:none}
.dot-badge.on{display:block}
.menurow .btn{position:relative}
.menurow .btn svg{width:1.1em;height:1.1em;vertical-align:-.18em;margin-right:.3em}
/* locked captain */
.opp .porwrap{position:relative}
.opp .lock{position:absolute;inset:0;border-radius:50%;background:rgba(40,30,20,.55);display:none;align-items:center;justify-content:center}
.opp .lock svg,.opp .lock img{width:64%;height:auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.opp.locked .lock{display:flex}
.opp.locked img{filter:grayscale(1) brightness(.8)}
.capdots{display:flex;gap:5px;margin-top:6px}
.capdots i{width:10px;height:10px;border-radius:50%;border:1.5px solid #8a6a2e;background:#efe3c8}
.capdots i.won{background:var(--brass)}.capdots i.cur{box-shadow:0 0 0 2px rgba(79,138,60,.8)}
/* modal */
.modal{position:fixed;inset:0;z-index:80;background:rgba(15,10,5,.6);display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .card{background:url(assets/ui/panel.png) center/100% 100% no-repeat;padding:7% 8% 6%;width:min(560px,94vw);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55))}
.modal h2{font-size:clamp(20px,2.6vw,30px)}
.modal p{margin:0;color:var(--ink2);font-size:15px;line-height:1.35}
.modal input{width:100%;max-width:340px;font:inherit;font-size:20px;padding:10px 14px;border-radius:10px;border:2px solid #8a6a2e;background:#fffaf0;color:var(--ink);text-align:center;outline:none}
.modal input:focus{box-shadow:0 0 0 3px rgba(184,137,59,.45)}
.modal .err{color:var(--hit);font-weight:bold;min-height:1.3em;font-size:14px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:100%}
.dayc{border:2px solid #8a6a2e;border-radius:10px;background:#f6ecd4;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.dayc img{width:30px;height:30px}
.dayc b{font-size:14px}
.dayc.done{opacity:.55}
.dayc.done::after{content:"✓";position:absolute;top:2px;right:5px;color:var(--green);font-weight:bold}
.dayc.today{background:#fff3c9;box-shadow:0 0 0 3px var(--brass),0 0 14px rgba(232,182,74,.8);transform:scale(1.06)}
/* leaders */
#leaders{background-image:url(assets/bg/menu.jpg)}
#leaders .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:2vh 2vw}
#leaders .card{background:url(assets/ui/panel.png) center/100% 100% no-repeat;padding:4.5% 5% 4%;width:min(720px,96vw);height:min(92vh,860px);display:flex;flex-direction:column;gap:10px;filter:drop-shadow(0 14px 26px rgba(0,0,0,.5))}
#leaders h2{text-align:center;font-size:clamp(24px,3vw,34px)}
.tabs{display:flex;justify-content:center;gap:8px}
.tab{font:inherit;font-weight:bold;font-size:15px;padding:7px 16px;border-radius:20px;border:2px solid #8a6a2e;background:#f1e3c2;color:var(--ink)}
.tab.on{background:var(--brass);color:#fff8e6;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.lnote{text-align:center;font-size:13px;color:var(--ink2);min-height:1.2em}
.lbox{flex:1;overflow:auto;border-radius:10px;background:rgba(255,250,236,.75);border:1px solid rgba(138,106,46,.5)}
.lrow{display:grid;grid-template-columns:54px 1fr 42px 70px;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid rgba(138,106,46,.25)}
.lrow.head{position:sticky;top:0;background:#efe0bc;font-size:12px;font-weight:bold;color:var(--ink2);z-index:1}
.lrow .pl{font-weight:bold;text-align:center;font-size:16px}
.lrow .pl svg{width:38px;height:38px;display:block;margin:auto}
.lrow .nm{font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .nm small{display:block;font-weight:normal;font-size:11px;color:var(--ink2)}
.lrow .rk img{width:34px;height:34px;border-radius:5px;object-fit:cover;border:1px solid #8a6a2e;display:block}
.lrow .vl{text-align:right;font-weight:bold;font-size:17px}
.lrow.me{background:rgba(232,182,74,.32)}
.lrow.sep{display:block;text-align:center;color:var(--ink2);padding:2px}
.lfoot{display:flex;justify-content:center}

.iconbtn.lang{font-size:14px;font-weight:bold;letter-spacing:.04em}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid #8a6a2e;background:rgba(244,232,205,.95);font-size:20px;color:var(--ink);display:flex;align-items:center;justify-content:center}

/* ---------- boards ---------- */
#setup,#battle{background-image:url(assets/bg/battle.jpg)}
.boardwrap{position:relative;display:inline-grid;grid-template-columns:calc(var(--b)*.06) var(--b);grid-template-rows:calc(var(--b)*.06) var(--b)}
.labels-top{grid-column:2;display:grid;grid-template-columns:8.6% repeat(10,8.3%);align-items:end;font-size:calc(var(--b)*.032);font-weight:bold;color:var(--ink)}
.labels-left{grid-row:2;display:grid;grid-template-rows:8.5% repeat(10,8.34%);justify-items:center;align-items:center;font-size:calc(var(--b)*.032);font-weight:bold;color:var(--ink)}
.labels-top span{text-align:center}
.board{grid-column:2;grid-row:2;position:relative;width:var(--b);height:var(--b);background-size:100% 100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.board.me{background-image:url(assets/board/board_player.jpg)}
.board.foe{background-image:url(assets/board/board_enemy.jpg)}
.grid{position:absolute}
.board.me .grid{left:8.31%;top:8.5%;width:83.0%;height:83.4%}
.board.foe .grid{left:8.7%;top:8.5%;width:84.2%;height:83.4%}
.cell{position:absolute;width:10%;height:10%}
.board.foe.active .cell.free{cursor:crosshair}
.board.foe.active .cell.free:hover{background:rgba(179,38,30,.16);box-shadow:inset 0 0 0 2px rgba(179,38,30,.55)}
.mark{position:absolute;inset:0;background-size:contain;background-repeat:no-repeat;background-position:center;pointer-events:none}
.mark.miss{background-image:url(assets/fx/mark_miss.png);-webkit-mask-image:radial-gradient(circle,#000 45%,transparent 70%);mask-image:radial-gradient(circle,#000 45%,transparent 70%);transform:scale(1.05);animation:pop .25s}
.mark.hit{background-image:url(assets/fx/mark_hit.png);transform:scale(1.1);animation:pop .25s;z-index:4}
.mark.dot{background-image:url(assets/fx/mark_blocked.png);animation:pop .25s}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.ship{position:absolute;pointer-events:none;z-index:2}
.ship img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;pointer-events:none}
.ship.v{transform-origin:0 0;transform:rotate(90deg)}
.ship.sunkfoe img{animation:fadeIn .6s both}
.fx{position:absolute;pointer-events:none;z-index:5;background-repeat:no-repeat}
.preview{position:absolute;z-index:6;pointer-events:none;border-radius:4px}
.preview.ok{background:rgba(79,138,60,.35);box-shadow:inset 0 0 0 2px rgba(79,138,60,.9)}
.preview.bad{background:rgba(179,38,30,.3);box-shadow:inset 0 0 0 2px rgba(179,38,30,.9)}
.target{position:absolute;inset:-8%;border:2px solid var(--hit);border-radius:50%;z-index:6;pointer-events:none;animation:aim .5s ease-out forwards}
@keyframes aim{from{transform:scale(2.2);opacity:0}60%{opacity:1}to{transform:scale(1);opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translate(-5px,2px)}50%{transform:translate(4px,-3px)}75%{transform:translate(-3px,1px)}}

/* ---------- setup ---------- */
.side h2{font-size:clamp(20px,2.4vw,28px)}
.side p{margin:0;font-size:clamp(13px,1.35vw,16px);color:var(--ink2);line-height:1.35}
.dock{display:flex;flex-direction:column;gap:6px;padding:10px;min-height:120px}
.dockrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:calc(var(--b)*.085)}
.dockship{position:relative;height:calc(var(--b)*.083);cursor:grab;touch-action:none}
.dockship img{height:100%;width:100%;object-fit:contain;pointer-events:none}
.dockship.used{opacity:.18;cursor:default}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.85;transform-origin:0 0}
.ghost img{width:100%;position:absolute;left:0;top:50%;transform:translateY(-50%)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- battle ---------- */
#battle .top .meside{justify-self:end}
.topright{justify-self:start;display:flex;align-items:center;gap:18px}
.meside{display:flex;align-items:center;gap:12px;position:relative}
.meside .cn{font-weight:bold;font-size:clamp(15px,1.7vw,20px);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meside .cl{font-size:12px;color:var(--ink2)}
.mebtn{position:relative;background:none;border:none;padding:0;width:92px;height:92px;cursor:pointer;flex:none;transition:transform .12s}
.mebtn:hover{transform:scale(1.04)}
.mebtn .av{width:92px;height:92px;font-size:40px;border:3px solid var(--brass);box-shadow:0 4px 12px rgba(0,0,0,.45)}
.mebtn .stkhint{position:absolute;right:-6px;bottom:-4px;width:38px;height:38px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.mebtn.on .av{box-shadow:0 0 0 3px #fff3c9,0 0 16px 4px rgba(255,215,106,.85)}
.captain .ctext{text-align:right}
.bcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.captain{display:flex;align-items:center;gap:12px;position:relative}
.captain img.por{width:92px;height:92px;border-radius:50%;object-fit:cover;border:3px solid var(--brass);box-shadow:0 4px 12px rgba(0,0,0,.45);background:#000}
.captain .cn{font-weight:bold;font-size:clamp(15px,1.7vw,20px)}
.captain .cl{font-size:12px;color:var(--ink2)}
.bubble{position:absolute;right:20px;top:96px;transform:scale(.6);transform-origin:calc(100% - 20px) 0;opacity:0;transition:.25s;display:flex;align-items:center;gap:8px;
  background:#fffaf0;border:2px solid #8a6a2e;border-radius:14px;padding:6px 12px 6px 6px;box-shadow:0 6px 16px rgba(0,0,0,.35);z-index:20;white-space:nowrap}
.bubble.on{opacity:1;transform:scale(1)}
.bubble::before{content:"";position:absolute;right:22px;top:-9px;border:8px solid transparent;border-top:0;border-bottom:9px solid #8a6a2e}
.bubble img{width:64px;height:72px;object-fit:cover;border-radius:8px}
.bubble span{font-size:16px;font-style:italic;max-width:260px;white-space:normal}
.turn{width:clamp(270px,24vw,360px);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(16px,1.8vw,23px);font-weight:bold;padding:10px 14px}
.turn.me{color:var(--green)} .turn.foe{color:var(--hit)}


/* ---------- аватар ---------- */
.avbtn{position:relative;background:none;border:none;padding:0;width:58px;height:58px;flex:none;cursor:pointer}
.avbtn .lvlbadge{position:absolute;right:-8px;bottom:-6px;width:30px;height:30px}
.avbtn .lvlbadge::before{inset:3px}
.avbtn .lvlbadge b{font-size:13px}.avbtn .lvlbadge small{display:none}
.av{display:inline-flex;align-items:center;justify-content:center;line-height:1!important;border-radius:50%;background:#e9dcbc center/cover no-repeat;border:2px solid #8a6a2e;box-shadow:0 2px 5px rgba(0,0,0,.3);flex:none;
  position:relative;overflow:hidden;color:#6b4a1a;font-weight:bold;text-align:center}
.av.big{width:58px;height:58px;font-size:26px;line-height:54px}
.av.huge{width:112px;height:112px;font-size:52px;line-height:108px;border-width:3px}
.av.sm{width:34px;height:34px;font-size:16px;line-height:30px}
.avnow{display:flex;align-items:center;gap:14px;font-size:20px}
.avgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(100%,420px);max-height:34vh;overflow-y:auto;overflow-x:hidden;padding:6px;box-sizing:border-box}
.avgrid button{min-width:0;width:100%}
.avgrid button{background:none;border:none;padding:0;border-radius:50%;cursor:pointer;aspect-ratio:1;transition:transform .1s}
.avgrid button:hover{transform:scale(1.08)}
.avgrid button .av{width:100%;height:100%;font-size:22px}
.av.stk{background-color:#efe0bc;background-size:112%}
.avgrid button.on .av{box-shadow:0 0 0 3px var(--green),0 0 12px rgba(79,138,60,.8)}
.lrow .nmw{display:flex;align-items:center;gap:8px;min-width:0}
.lrow .vl small{display:block;font-size:10px;font-weight:normal;color:var(--ink2)}
/* ---------- стикеры в бою ---------- */
.iconbtn.stkbtn{width:52px;height:52px;padding:0;overflow:hidden;background:radial-gradient(circle at 40% 35%,#fbf3df,#e2c98f)!important}
.iconbtn.stkbtn img{width:118%;height:118%;object-fit:cover}
.iconbtn.stkbtn.on{box-shadow:0 0 0 3px var(--brass),0 0 14px 3px rgba(255,215,106,.8)}
.stkpanel{position:fixed;top:118px;left:18px;z-index:40;display:none;align-items:center;gap:6px;padding:8px 10px;border-radius:16px;
  background:rgba(244,232,205,.97);border:2px solid #8a6a2e;box-shadow:0 10px 24px rgba(0,0,0,.45)}
.stkpanel.on{display:flex}
.stkpanel>button{width:30px;height:30px;border-radius:50%;border:1.5px solid #8a6a2e;background:#f6ecd4;color:var(--ink);font-size:13px;padding:0}
#stkRow{display:flex;gap:4px}
#stkRow button{width:74px;height:74px;border:none;background:none;padding:0;border-radius:12px;transition:transform .12s}
#stkRow button:hover{transform:scale(1.12) rotate(-3deg)}
#stkRow button:disabled{opacity:.4;transform:none}
#stkRow img{width:100%;height:100%;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.mystk{position:fixed;left:3vw;top:128px;z-index:30;width:min(18vw,170px);pointer-events:none;opacity:0}
.mystk img{width:100%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.45))}
/* ---------- магазин энергии ---------- */
.enplus{position:relative;width:30px;height:30px;border-radius:50%;padding:0;margin-left:6px;cursor:pointer;display:inline-grid;place-items:center;
  background:radial-gradient(circle at 35% 30%,#fff3c4,#e2b450 55%,#a8761f);border:2px solid #6b4a18;box-shadow:0 2px 0 #5a3c12,0 3px 6px rgba(0,0,0,.35)}
.enplus svg{width:17px;height:17px}
.enplus b{position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;line-height:15px;border:1.5px solid #fff4d6}
.enplus:hover{filter:brightness(1.08)} .enplus:active{transform:translateY(1px);box-shadow:0 1px 0 #5a3c12}
.enplus.low{animation:enpulse 1.4s ease-in-out infinite}
@keyframes enpulse{0%,100%{box-shadow:0 2px 0 #5a3c12,0 0 0 0 rgba(255,210,90,.8)}50%{box-shadow:0 2px 0 #5a3c12,0 0 0 7px rgba(255,210,90,0)}}
.enbox{cursor:pointer}
#enModal .have svg{width:30px;height:30px}
.emnote{font-size:13px!important;opacity:.8}
.pack .bolt{display:flex;align-items:center;gap:2px;font-size:22px;font-weight:bold;color:#2f5f8a}.pack .bolt svg{width:26px;height:26px}
/* ---------- автобой ---------- */
.iconbtn.autob{width:52px;height:52px;background:radial-gradient(circle at 40% 35%,#fbf3df,#e2c98f)!important;transition:transform .15s, box-shadow .2s}
.iconbtn.autob svg{width:72%;height:72%}
.iconbtn.autob.on{box-shadow:0 0 0 3px var(--brass),0 0 16px 4px rgba(255,215,106,.85)}
.iconbtn.autob.on svg{animation:helm 3s linear infinite}
@keyframes helm{to{transform:rotate(360deg)}}
.iconbtn.autob.rest{filter:grayscale(.9);opacity:.6}
/* ---------- расширенный режим ---------- */
.fuelchip{display:flex;align-items:center;gap:3px;font:inherit;font-weight:bold;color:#6b3f12;background:none;border:none;padding:0;cursor:pointer}
.fuelchip img{width:28px;height:28px;border-radius:5px}
.fuelchip i{font-style:normal;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;font-size:13px;line-height:16px;text-align:center;margin-left:2px}
.modetabs{display:flex;gap:8px;justify-content:center;margin-bottom:-1vh}
.modetabs .tab{display:flex;align-items:center;gap:6px}
.modetabs .tab.locked{opacity:.75}
.modetabs .mlock{display:none}.modetabs .tab.locked .mlock{display:inline-flex}
.mlock svg{width:14px;height:14px}
#setup.p2 .side:not(.ars){display:none}
#setup.p2 .side.ars{display:flex}
.fuelline{display:flex;align-items:center;gap:8px;font-size:18px}
.fuelline img{width:34px;height:34px;border-radius:6px}
.fuelline b{font-size:22px;color:#6b3f12}
.fuelline .btn{margin-left:auto}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:8px}
.item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:6px;padding:4px 6px;border-radius:8px;background:rgba(255,250,236,.7);border:1px solid rgba(138,106,46,.4);position:relative}
.item img{width:44px;height:44px;border-radius:50%}
.item .nm{font-weight:bold;font-size:13px;line-height:1.1}
.item .pr{font-size:12px;color:#6b3f12}
.item .ct{display:flex;align-items:center;gap:3px}
.item .ct b{min-width:30px;text-align:center;font-size:13px}
.item .ct button{width:24px;height:24px;border-radius:50%;border:1.5px solid #8a6a2e;background:#f6ecd4;font-weight:bold;color:var(--ink);padding:0;line-height:1}
.item .ct button:disabled{opacity:.35;cursor:default}
.item.lock{opacity:.55}.item.lock img{filter:grayscale(1)}
.item .lk{font-size:11px;color:var(--hit);font-weight:bold}
.item.placing{box-shadow:0 0 0 3px var(--green)}
.item[title]{cursor:help}
.arsbar{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:0;padding-left:calc(var(--b)*.06)}
.arsbar:empty{display:none}
.wbtn{position:relative;width:clamp(44px,4.2vw,58px);height:clamp(44px,4.2vw,58px);border-radius:50%;border:none;background:none;padding:0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));transition:transform .1s}
.wbtn img{width:100%;height:100%;border-radius:50%;display:block}
.wbtn b{position:absolute;right:-3px;bottom:-3px;min-width:20px;height:20px;border-radius:10px;background:#fff7e3;border:1.5px solid #8a6a2e;font-size:12px;line-height:17px;color:var(--ink)}
.wbtn.on{transform:scale(1.12);filter:drop-shadow(0 0 6px #ffd76a) drop-shadow(0 0 3px #ffd76a)}
.wbtn:disabled{filter:grayscale(.8) brightness(.85);cursor:default}
.wbtn:not(:disabled):hover{transform:scale(1.08)}
.zone{position:absolute;z-index:7;pointer-events:none;border-radius:4px;background:rgba(179,38,30,.18);box-shadow:inset 0 0 0 2px rgba(179,38,30,.85)}
.zone.bad{background:rgba(90,90,90,.25);box-shadow:inset 0 0 0 2px rgba(60,60,60,.8)}
.zone.soft{background:rgba(179,38,30,.08);box-shadow:inset 0 0 0 2px rgba(179,38,30,.45);border-style:dashed}
.zone.def{background:rgba(62,124,134,.25);box-shadow:inset 0 0 0 2px rgba(62,124,134,.9)}
.board.aiming .cell{cursor:crosshair}
.pvoband{position:absolute;left:-2%;width:104%;height:20%;z-index:1;pointer-events:none;border-radius:6px;
  background:repeating-linear-gradient(135deg,rgba(62,124,134,.16) 0 8px,rgba(62,124,134,.05) 8px 16px);box-shadow:inset 0 0 0 2px rgba(62,124,134,.55)}
.pvoband img{position:absolute;left:-7%;top:50%;width:13%;transform:translateY(-50%);filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.board.foe .pvoband{background:repeating-linear-gradient(135deg,rgba(179,38,30,.16) 0 8px,rgba(179,38,30,.04) 8px 16px);box-shadow:inset 0 0 0 2px rgba(179,38,30,.55)}
.board.foe .pvoband img{left:auto;right:-7%}
.minecell{position:absolute;inset:8%;background:url(assets/arsenal/mine_top.png) center/contain no-repeat;z-index:3;pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.mark.minex{background-image:url(assets/arsenal/mine_top.png);mix-blend-mode:normal;opacity:.55;filter:grayscale(.6) sepia(.4);transform:scale(.8)}
.spot{position:absolute;inset:6%;z-index:4;pointer-events:none;border:2px dashed var(--hit);border-radius:5px;background:rgba(179,38,30,.12);animation:spot 1.2s ease-in-out infinite alternate}
@keyframes spot{to{background:rgba(179,38,30,.28)}}
.plane{position:absolute;z-index:9;pointer-events:none;transform-origin:50% 50%}
.plane img{width:100%;display:block;filter:drop-shadow(0 10px 6px rgba(0,0,0,.35))}
.ovl{position:absolute;z-index:8;pointer-events:none;background-size:100% 100%;background-repeat:no-repeat}
.subspr{position:absolute;z-index:6;pointer-events:none;background:url(assets/arsenal/submarine_top.png) center/contain no-repeat}
.trail{position:absolute;z-index:6;pointer-events:none;background:url(assets/fx/torpedo_trail.png) right center/auto 100% no-repeat;height:10%}
.trail.rev{transform:scaleX(-1)}
.trail.v{width:10%;height:auto}
/* топливо */
.have{display:flex;gap:22px;justify-content:center;font-size:20px}
.have span{display:flex;align-items:center;gap:6px}.have img{width:32px;height:32px;border-radius:6px}
.packs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pack{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 14px;border-radius:12px;border:2px solid #8a6a2e;background:#f6ecd4;min-width:150px}
.pack img{width:56px;height:56px;border-radius:8px}
.pack b{font-size:20px}
/* ---------- result ---------- */
#result .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#result .panel{background:url(assets/ui/panel.png) center/100% 100% no-repeat;border:none;box-shadow:none;padding:6% 7% 5%;filter:drop-shadow(0 12px 22px rgba(0,0,0,.5));text-align:center;min-width:min(460px,92vw);display:flex;flex-direction:column;gap:14px;align-items:center}
#result h1{font-size:clamp(40px,7vw,84px);letter-spacing:.06em;line-height:1}
#result h1.win{color:var(--brass);text-shadow:0 2px 0 #6b4c14,0 0 24px rgba(255,220,140,.6)}
#result h1.lose{color:var(--hit);text-shadow:0 2px 0 #4a0f0b}
#result .delta{font-size:22px;font-weight:bold}
#result .sub{color:var(--ink2);font-size:15px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff7e3;border:2px solid var(--brass);border-radius:10px;padding:10px 18px;font-weight:bold;z-index:90;
  box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:1}


/* =====================================================================
   АДАПТИВНАЯ ВЁРСТКА
   Размер поля --b считается от ширины И высоты экрана, поэтому раскладка
   не «прыгает»: шапка боя всегда ровно над полями, всё помещается без прокрутки.
   ===================================================================== */
*{scrollbar-width:thin;scrollbar-color:#b8893b rgba(0,0,0,.08)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#b8893b;border-radius:6px}::-webkit-scrollbar-track{background:rgba(0,0,0,.06)}

/* ---- бой ---- */
#battle{--hh:clamp(60px,12vh,104px);--lbl:28px;--gap:3vw;--btn:clamp(36px,calc(var(--hh)*.5),50px);--avs:clamp(46px,calc(var(--hh) - 14px),88px);
  --b:min(calc((100vw - 32px - var(--gap))/2.12), calc((var(--vh,100vh) - var(--hh) - var(--lbl) - 26px)/1.06))}
#battle.adv{--b:min(calc((100vw - 32px - var(--gap))/2.12), calc((var(--vh,100vh) - var(--hh) - var(--lbl) - 80px)/1.06))}
#battle .bfr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 12px}
#battle .top{position:relative;width:calc(2.12*var(--b) + var(--gap));min-width:min(100%,560px);max-width:calc(100vw - 16px);height:var(--hh);flex:none;
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:12px;container-type:inline-size}
#battle .top .meside{justify-self:start;min-width:0}
.topright{justify-self:end;display:flex;align-items:center;gap:10px;min-width:0}
.mebtn,.mebtn .av{width:var(--avs);height:var(--avs);font-size:calc(var(--avs)*.42)}
.mebtn .stkhint{width:calc(var(--avs)*.42);height:calc(var(--avs)*.42)}
.captain img.por{width:var(--avs);height:var(--avs)}
.meside .ctext,.captain .ctext{min-width:0}
.meside .cn,.captain .cn{font-size:clamp(14px,1.5vw,19px);max-width:22vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.captain .cl,.meside .cl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.topright .iconbtn,.topright .iconbtn.pic{width:var(--btn);height:var(--btn);flex:none}
.turn{width:clamp(150px,22vw,320px);font-size:clamp(14px,1.6vw,22px);padding:8px 12px}
.bubble{top:calc(var(--avs) + 8px)}
@container (max-width:860px){ .meside .ctext,.captain .ctext{display:none} }
@media (max-aspect-ratio:1/1),(max-width:900px){ #battle .top{grid-template-columns:auto minmax(0,1fr) auto} #battle .turn{justify-self:center;max-width:100%} }
@container (max-width:640px){ .turn{width:auto;min-width:0;white-space:normal;overflow:visible;text-overflow:clip;font-size:13px;padding:6px 8px;line-height:1.15} .topright{gap:6px} }
#battle .boards{display:flex;align-items:flex-start;justify-content:center;gap:var(--gap);flex:none}
.bcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.bcol .lbl{height:var(--lbl);width:calc(var(--b)*1.06);padding-left:calc(var(--b)*.06);display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:clamp(14px,1.5vw,19px);font-weight:bold;white-space:nowrap}
.fleet{display:flex;align-items:center;gap:3px;flex-wrap:nowrap}
.fleet .pip{display:block;height:8px;width:calc(var(--n)*7px);border-radius:3px;background:var(--ink2)}
.fleet .pip.dead{background:transparent;box-shadow:inset 0 0 0 1px var(--hit)}
.fleet u{width:5px}
.arsbar{min-height:50px;align-items:center}

/* ---- расстановка ---- */
#setup{--side:clamp(280px,30vw,420px);--b:min(calc((var(--vh,100vh) - 36px)/1.06), calc((100vw - var(--side) - 3vw - 40px)/1.06))}
#setup.p2{--side:clamp(330px,38vw,540px)}
#setup .wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:3vw;padding:12px 2vw;overflow-y:auto}
.side{container-type:inline-size;display:flex;flex-direction:column;gap:10px;width:var(--side);max-height:calc(var(--vh,100vh) - 24px);overflow-y:auto;padding:2px 4px 2px 2px}
#setup .side.ars{display:none}
.shop{grid-template-columns:repeat(2,minmax(0,1fr))}.item{min-width:0}.item .nm{overflow-wrap:anywhere}
@container (max-width:430px){ .shop{grid-template-columns:1fr} }
.dockrow{min-height:calc(var(--b)*.085)}
@media (max-height:620px) and (min-aspect-ratio:1/1){ .side p{display:none} .side h2{font-size:18px} .side{gap:6px} .btn{font-size:14px} .item img{width:32px;height:32px} .item{grid-template-columns:32px 1fr auto;padding:2px 4px} }

/* ---- меню ---- */
#menu .wrap{overflow-y:auto;justify-content:flex-start;padding:76px 12px 16px}

.title .logo{width:min(44vw,48vh,560px)}

body:has(.autoskip.on) .toast{bottom:calc(max(10px,env(safe-area-inset-bottom)) + 66px)}

const SAVE_KEY = 'locia.save.v1';
let save = {name:'', nameKey:'', pendingClaim:false, dirty:false,
  points:0, battles:0, wins:0, losses:0, flawless:0, beaten:0, coins:0, streak:0, lastDaily:'', xp:0, energy:null, energyTs:0,
  fuel:200, beatenAdv:0, mode:'classic', recent:[], av:'', xpAds:0,
  sound:true, music:true, lang:null};
try { Object.assign(save, JSON.parse(localStorage.getItem(SAVE_KEY) || '{}')); } catch(e) {}
if(typeof save.av==='string' && save.av.startsWith('u:')){ save.av=''; save.dirty=true; }   // свои фото больше не используются
LANG = save.lang || ((navigator.language||'ru').toLowerCase().startsWith('ru')?'ru':'en');
function persist(){ save.ts=Date.now(); try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch(e) {} pkbStore(); }
/* Облачные сохранения Пикабу: на Пикабу весь прогресс дублируется в sdk.storage и следует за аккаунтом игрока
   на любое устройство. Туда же кладётся ключ анонимного аккаунта Firebase, чтобы на новом устройстве
   рейтинг и имя остались за тем же игроком. Вне Пикабу ничего не меняется. */
const PKB_SAVE='save', PKB_AUTH='fbAuth';
function pkbStore(){
  let sdk=null; try{ sdk=PKB.sdk; }catch(e){ return; } if(!sdk || !PKB.cloudReady) return;
  try{ sdk.storage.set(PKB_SAVE, JSON.parse(JSON.stringify(save))); }catch(e){ console.warn('pkb storage',e); }
}
function pkbStoreAuth(a){ let sdk=null; try{ sdk=PKB.sdk; }catch(e){ return; } if(!sdk || !PKB.cloudReady || !a) return; try{ sdk.storage.set(PKB_AUTH, a); }catch(e){} }
function rankIndex(pts){ let r=0; for(let i=0;i<RANK_PTS.length;i++) if(pts>=RANK_PTS[i]) r=i; return r; }
const isAdv = () => save.mode==='adv' && advOpen();
const advOpen = () => (save.beaten||0) >= ADV_UNLOCK;               // режим с арсеналом — после победы над 3-м капитаном
const ADV_UNLOCK = 3;
const beatenNow = () => isAdv() ? (save.beatenAdv||0) : (save.beaten||0);
const unlockedMax = () => Math.min(8, beatenNow() + 1);
// очки за бой: чем сильнее соперник, тем больше
const WIN_PTS_BY_LVL = [0,10,15,20,25,30,35,40,50];
function battlePoints(win, lvl, flawless, enemySunk, adv){
  const m = adv ? 2 : 1;                                 // с арсеналом очков вдвое больше (как в оригинале: +20 вместо +10)
  if(!win) return {total:enemySunk*m, parts:[['ptsLoss',enemySunk,enemySunk*m]]};
  const base=WIN_PTS_BY_LVL[lvl]*m, bonus=flawless?Math.round(base/2):0;
  const parts=[['ptsWin',lvl,base]]; if(bonus) parts.push(['ptsFlawless',bonus]);
  return {total:base+bonus, parts};
}
const STAT_FIELDS=['points','wins','losses','battles','flawless','beaten','coins','streak','lastDaily','xp','energy','energyTs','fuel','beatenAdv','av','xpAds'];

/* ---------- опыт и уровни ---------- */
const xpNeed = L => Math.round(100 * Math.pow(1.4, L-1));  // опыта до следующего уровня: каждый уровень в 1,4 раза дороже
function levelInfo(xp){ let L=1, rest=xp||0; while(L<99 && rest>=xpNeed(L)){ rest-=xpNeed(L); L++; } return {L, cur:rest, need:xpNeed(L)}; }
function battleXp(win,lvl,flawless,enemySunk,adv){
  const m = adv ? 1.5 : 1;
  if(!win) return Math.round((5 + 2*enemySunk)*m);
  const base=(20+10*(lvl-1))*m; return Math.round(flawless ? base*1.25 : base);
}
/* ---------- топливо ---------- */
const FUEL_START=200, FUEL_PER_SHIP=5, FUEL_WIN=20;
const FUEL_PACKS=[{fuel:50,coins:100},{fuel:160,coins:300}];
/* ---------- энергия ---------- */
const ENERGY_BASE=100, ENERGY_PER_LVL=5, REGEN_MS=3*60*1000;   // 20 в час
const COST_CLASSIC=10, COST_ADV=15;
const battleCost = () => isAdv() ? COST_ADV : COST_CLASSIC;
// новый уровень: +5 к запасу и +5 к текущей энергии (купленная сверх запаса не срезается)
function levelUpEnergy(d){ if(save.energy<maxEnergy()) save.energy=Math.min(maxEnergy(), save.energy+ENERGY_PER_LVL*d); }
const maxEnergy = () => ENERGY_BASE + ENERGY_PER_LVL*(levelInfo(save.xp).L-1);
function energyNow(){
  const max=maxEnergy(), now=Date.now();
  if(typeof save.energy!=='number'){ save.energy=max; save.energyTs=now; }
  if(!save.energyTs || save.energyTs>now) save.energyTs=now;
  if(save.energy>=max){ save.energyTs=now; return save.energy; }
  const ticks=Math.floor((now-save.energyTs)/REGEN_MS);
  if(ticks>0){ save.energy=Math.min(max,save.energy+ticks); save.energyTs = save.energy>=max ? now : save.energyTs+ticks*REGEN_MS; persist(); }
  return save.energy;
}
function nextEnergyMs(){ energyNow(); return save.energy>=maxEnergy() ? 0 : REGEN_MS-(Date.now()-save.energyTs); }
const mmss = ms => { const t=Math.ceil(ms/1000); return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
function spendEnergy(){
  energyNow();
  const cost=battleCost();
  if(save.energy<cost) return false;
  if(save.energy>=maxEnergy()) save.energyTs=Date.now();
  save.energy-=cost; save.dirty=true; persist(); return true;
}
function renderHud(){
  const li=levelInfo(save.xp), en=energyNow(), max=maxEnergy();
  $('lvlNum').textContent=li.L; $('lvlBadge').style.setProperty('--p', Math.round(li.cur/li.need*100));
  $('lvlBadge').title=T('xpOf',li.cur,li.need); $('xpTxt').textContent=T('xpOf',li.cur,li.need);
  $('enTxt').textContent=`${en}/${max}`; $('enBar').style.width=(en/max*100)+'%'; $('enPlus').classList.toggle('low', en<battleCost());
  const ms=nextEnergyMs(); $('enTimer').textContent= ms ? T('enNext',mmss(ms)) : T('enFull');
}
setInterval(()=>{ if($('menu').classList.contains('on')) { renderHud(); updatePlayBtn(); } },1000);
const DAILY_COINS=[50,75,100,125,150,200,300];
const dayStr = d => { const z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; };
const today = () => dayStr(new Date());
const yesterday = () => { const d=new Date(); d.setDate(d.getDate()-1); return dayStr(d); };
function normName(n){ return n.trim().replace(/\s+/g,' '); }
function nameKeyOf(n){ return normName(n).toLowerCase().replace(/ /g,'_'); }
const NAME_RE = /^[\p{L}\p{N}_\- ]{3,16}$/u;

/* =========================================================
   ОНЛАЙН-ХРАНИЛИЩЕ: Firebase (анонимный вход + Firestore REST)
   ========================================================= */
const FB = (window.LOCIA_FIREBASE && window.LOCIA_FIREBASE.apiKey && window.LOCIA_FIREBASE.projectId) ? window.LOCIA_FIREBASE : null;
const Cloud = {
  enabled: !!FB, online:false, uid:null, token:null, exp:0, auth:null,
  base(){ return `https://firestore.googleapis.com/v1/projects/${FB.projectId}/databases/(default)/documents`; },
  doc(path){ return `projects/${FB.projectId}/databases/(default)/documents/${path}`; },
  loadAuth(){ try{ this.auth=JSON.parse(localStorage.getItem('locia.auth')||'null'); }catch(e){ this.auth=null; } },
  saveAuth(){ try{ localStorage.setItem('locia.auth',JSON.stringify(this.auth)); }catch(e){} pkbStoreAuth(this.auth); },
  async signIn(){
    if(this.token && Date.now() < this.exp-60000) return;
    if(!this.auth) this.loadAuth();
    if(this.auth && this.auth.refresh){
      const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB.apiKey}`,{method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(this.auth.refresh)});
      if(r.ok){ const j=await r.json(); this.token=j.id_token; this.exp=Date.now()+(+j.expires_in)*1000; this.uid=j.user_id; this.auth={uid:j.user_id,refresh:j.refresh_token}; this.saveAuth(); return; }
      if(r.status!==400) throw new Error('auth '+r.status);   // сеть/сервер — не создаём новый аккаунт
    }
    const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB.apiKey}`,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({returnSecureToken:true})});
    if(!r.ok) throw new Error('signup '+r.status);
    const j=await r.json(); this.token=j.idToken; this.exp=Date.now()+(+j.expiresIn)*1000; this.uid=j.localId;
    this.auth={uid:j.localId,refresh:j.refreshToken}; this.saveAuth();
  },
  enc(o){ const f={}; for(const [k,v] of Object.entries(o)) f[k]= typeof v==='number'?{integerValue:String(Math.round(v))}:{stringValue:String(v)}; return f; },
  dec(f){ const o={}; for(const [k,v] of Object.entries(f||{})) o[k]= 'integerValue' in v ? +v.integerValue : 'doubleValue' in v ? +v.doubleValue : 'stringValue' in v ? v.stringValue : 'timestampValue' in v ? v.timestampValue : null; return o; },
  async req(url,opt={},auth=true){
    if(auth) await this.signIn();
    const h={'Content-Type':'application/json'}; if(auth&&this.token) h.Authorization='Bearer '+this.token;
    const r=await fetch(url,{...opt,headers:h}); return r;
  },
  async commit(writes){
    const r=await this.req(`${this.base()}:commit`,{method:'POST',body:JSON.stringify({writes})});
    if(r.ok) return {ok:true};
    let code=''; try{ code=(await r.json()).error.status; }catch(e){}
    return {ok:false,status:r.status,code};
  },
  async getDoc(path){
    const r=await this.req(`${this.base()}/${path.split('/').map(encodeURIComponent).join('/')}`,{method:'GET'});
    if(r.status===404) return null; if(!r.ok) throw new Error('get '+r.status);
    return this.dec((await r.json()).fields);
  },
  stats(){ const o={}; for(const k of STAT_FIELDS) o[k]=save[k]; return o; },
  // занять имя и создать запись игрока одной транзакцией
  async claim(name,key){
    await this.signIn();
    const ex=await this.getDoc('names/'+key);
    if(ex && ex.uid!==this.uid) return 'taken';
    const zero={name,nameKey:key,points:0,wins:0,losses:0,battles:0,flawless:0,beaten:0,coins:0,streak:0,lastDaily:'',xp:0,energy:ENERGY_BASE,energyTs:Date.now(),fuel:FUEL_START,beatenAdv:0,av:save.av||'',xpAds:0};
    const writes=[];

    writes.push({update:{name:this.doc('players/'+this.uid),fields:this.enc(zero)},currentDocument:{exists:false},
      updateTransforms:[{fieldPath:'createdAt',setToServerValue:'REQUEST_TIME'},{fieldPath:'updatedAt',setToServerValue:'REQUEST_TIME'}]});
    const r=await this.commit(writes);

      const mine=await this.getDoc('players/'+this.uid); if(mine && mine.nameKey===key) return 'ok';
      return 'taken';
    }
    throw new Error('claim '+r.status);
  },
  async push(){
    const st=this.stats();
    const r=await this.commit([{update:{name:this.doc('players/'+this.uid),fields:this.enc(st)},updateMask:{fieldPaths:STAT_FIELDS},
      currentDocument:{exists:true},updateTransforms:[{fieldPath:'updatedAt',setToServerValue:'REQUEST_TIME'}]}]);
    if(r.ok) return 'ok';
    if(r.status===403 || r.status===404 || r.code==='PERMISSION_DENIED' || r.code==='NOT_FOUND') return 'rejected';
    throw new Error('push '+r.status);
  },
  async pull(){ return this.getDoc('players/'+this.uid); },
  async top(field,limit=50){
    const r=await this.req(`${this.base()}:runQuery`,{method:'POST',body:JSON.stringify({structuredQuery:{
      from:[{collectionId:'players'}],orderBy:[{field:{fieldPath:field},direction:'DESCENDING'}],limit}})},false);
    if(!r.ok) throw new Error('query '+r.status);
    return (await r.json()).filter(x=>x.document).map(x=>({uid:x.document.name.split('/').pop(),...this.dec(x.document.fields)}));
  },
  async placeOf(field,value){
    const r=await this.req(`${this.base()}:runAggregationQuery`,{method:'POST',body:JSON.stringify({structuredAggregationQuery:{
      structuredQuery:{from:[{collectionId:'players'}],where:{fieldFilter:{field:{fieldPath:field},op:'GREATER_THAN',value:{integerValue:String(value)}}}},
      aggregations:[{alias:'n',count:{}}]}})},false);
    if(!r.ok) throw new Error('count '+r.status);
    const j=await r.json(); return +(j[0].result.aggregateFields.n.integerValue)+1;
  }
};

async function syncProfile(){
  if(!Cloud.enabled) return;
  await pkbReady;                                   // на Пикабу сначала берём аккаунт и прогресс из облака
  if(!save.name) return;
  try{

      const res=await Cloud.claim(save.name,save.nameKey);
      if(res==='taken'){ save.name=''; save.nameKey=''; save.pendingClaim=false; persist(); openNameModal(T('nameTaken')); return; }
      save.pendingClaim=false; save.dirty=true; persist();
    }
    if(save.dirty){
      const r=await Cloud.push();
      if(r==='rejected'){ const srv=await Cloud.pull(); if(srv) for(const k of STAT_FIELDS) if(srv[k]!==undefined && srv[k]!==null) save[k]=srv[k]; }
      save.dirty=false; persist();
    } else {
      const srv=await Cloud.pull();
      if(srv){ for(const k of STAT_FIELDS) if(srv[k]!==undefined && srv[k]!==null) save[k]=srv[k]; persist(); }
    }
    Cloud.online=true; setNet('on');
  }catch(e){ Cloud.online=false; setNet('err'); console.warn('sync',e); }

}

let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function noise(dur, f0, f1, vol, q=1){ if(isFF()) return;
  if(!save.sound) return; const c=ac(); if(!c) return;
  const len=Math.floor(c.sampleRate*dur), buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
  const s=c.createBufferSource(); s.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.Q.value=q; f.frequency.setValueAtTime(f0,c.currentTime); f.frequency.exponentialRampToValueAtTime(f1,c.currentTime+dur);
  const g=c.createGain(); g.gain.value=vol; s.connect(f); f.connect(g); g.connect(c.destination); s.start();
}
function tone(freq, dur, vol=.15, type='sine', slide=0){ if(isFF()) return;
  if(!save.sound) return; const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.setValueAtTime(freq,c.currentTime);
  if(slide) o.frequency.exponentialRampToValueAtTime(freq*slide,c.currentTime+dur);
  g.gain.setValueAtTime(vol,c.currentTime); g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
}

const TRACKS={menu:['assets/music/menu.mp3',.45], setup:['assets/music/setup.mp3',.40], battle:['assets/music/battle.mp3',.32], boss:['assets/music/boss.mp3',.34]};
const JINGLES={win:'assets/music/win.mp3', lose:'assets/music/lose.mp3'};
const Music={
  want:null, name:null, cur:null, live:new Set(), unlocked:false, LOOP_AT:7,
  fade(el,to,ms){ clearInterval(el._f); const from=el.volume, t0=performance.now();
    el._f=setInterval(()=>{ const k=Math.min(1,(performance.now()-t0)/ms); el.volume=Math.max(0,Math.min(1,from+(to-from)*k));
      if(k>=1){ clearInterval(el._f); if(to===0){ el.pause(); this.live.delete(el); } } },40); },
  start(name){
    const [src,vol]=TRACKS[name]; const el=new Audio(src); el.volume=0; el._vol=vol; el._name=name;
    el.play().then(()=>this.fade(el,vol,1600)).catch(()=>{});
    this.live.add(el); this.cur=el; return el;
  },
  play(name){
    this.want=name;
    if(!this.unlocked || !save.music) return;
    if(this.name===name && this.cur && !this.cur.paused) return;
    this.stopAll(1200); this.name=name; this.start(name);
  },
  stopAll(ms=800){ for(const el of this.live) this.fade(el,0,ms); this.cur=null; this.name=null; },
  jingle(kind){
    this.stopAll(500); this.want='menu';
    if(!save.music || !this.unlocked) return;
    const j=new Audio(JINGLES[kind]); j.volume=.85; j.play().catch(()=>{});
    j.onended=()=>{ if(document.getElementById('result').classList.contains('on')) this.play('menu'); };
  },
  tick(){ // бесшовный повтор: за LOOP_AT секунд до конца запускаем трек заново поверх затухания
    const c=this.cur; if(!c || !c.duration || c._looped) return;
    if(c.currentTime > c.duration - this.LOOP_AT){ c._looped=true; this.start(c._name); setTimeout(()=>{ if(!c.paused) this.fade(c,0,2500); },this.LOOP_AT*1000-2500); }
  },
  unlock(){ if(this.unlocked) return; this.unlocked=true; if(this.want) this.play(this.want); },
  toggle(){ save.music=!save.music; persist(); if(save.music){ this.name=null; this.play(this.want||'menu'); } else this.stopAll(600); syncAudioBtns(); }
};

/* =========================================================
   МОДЕЛЬ ПОЛЯ
   ========================================================= */
class Field {
  constructor(){ this.ships=[]; this.shot=new Set(); this.blocked=new Set();
    this.mines=new Set(); this.minesHit=new Set(); this.pvo=[]; this.pvoSeen=new Set(); this.spotted=new Set(); }
  static key(x,y){ return y*N+x; }
  cellsOf(len,x,y,v){ const a=[]; for(let i=0;i<len;i++) a.push(v?[x,y+i]:[x+i,y]); return a; }
  shipAt(x,y){ return this.ships.find(s=>s.cells.some(([cx,cy])=>cx===x&&cy===y)); }
  canPlace(len,x,y,v,ignore){
    for (const [cx,cy] of this.cellsOf(len,x,y,v)){
      if(!inB(cx,cy)) return false;
      if(this.mines.has(Field.key(cx,cy))) return false;
      for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const s=this.shipAt(cx+dx,cy+dy); if(s && s!==ignore) return false;
      }
    }
    return true;
  }
  place(len,x,y,v,id){ const s={id, len, x, y, v, cells:this.cellsOf(len,x,y,v), hits:new Set(), sunk:false}; this.ships.push(s); return s; }
  autoPlace(){
    for(let attempt=0;attempt<200;attempt++){
      this.ships=[]; let ok=true;
      FLEET.forEach((len,id)=>{ if(!ok) return; let tries=0;
        while(true){ const v=Math.random()<.5, x=rnd(0,N-1), y=rnd(0,N-1);
          if(this.canPlace(len,x,y,v)){ this.place(len,x,y,v,id); break; }
          if(++tries>500){ ok=false; break; } } });
      if(ok) return;
    }
  }
  isFree(x,y){ const k=Field.key(x,y); return !this.shot.has(k) && !this.blocked.has(k); }
  // выстрел: miss / hit / sunk
  fire(x,y){
    const k=Field.key(x,y); this.shot.add(k); this.spotted.delete(k);
    const s=this.shipAt(x,y);
    if(!s) return {res:'miss'};
    s.hits.add(k);
    if(s.hits.size===s.len){ s.sunk=true;
      const around=[];
      for(const [cx,cy] of s.cells) for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
        const nx=cx+dx, ny=cy+dy, nk=Field.key(nx,ny);
        if(inB(nx,ny) && !this.shot.has(nk) && !this.blocked.has(nk) && !this.shipAt(nx,ny)){ this.blocked.add(nk); around.push([nx,ny]); }
      }
      return {res:'sunk', ship:s, around};
    }
    return {res:'hit', ship:s};
  }
  alive(){ return this.ships.filter(s=>!s.sunk); }
  allSunk(){ return this.ships.length>0 && this.ships.every(s=>s.sunk); }
  // оборона
  canMine(x,y){ const k=Field.key(x,y); return inB(x,y) && !this.mines.has(k) && !this.shipAt(x,y); }
  pvoAt(r){ return this.pvo.find(b=>r===b || r===b+1); }
  canPvo(r){ return r>=0 && r<=N-2 && !this.pvo.some(b=>Math.abs(b-r)<2); }
  autoDefense(nPvo,nMines){
    for(let i=0,t=0;i<nPvo && t<200;t++){ const r=rnd(0,N-2); if(this.canPvo(r)){ this.pvo.push(r); i++; } }
    for(let i=0,t=0;i<nMines && t<500;t++){ const x=rnd(0,N-1), y=rnd(0,N-1); if(this.canMine(x,y)){ this.mines.add(Field.key(x,y)); i++; } }
  }
}

  {chanceHit:20,step:15,max:80,reset:80,deadInRow:1,w4:50,w3:60,w2:70,oneDeck:40,arsenal:99,pvoMem:true, tactic:2},
  {chanceHit:20,step:15,max:80,reset:80,deadInRow:1,w4:50,w3:60,w2:70,oneDeck:40,arsenal:99,pvoMem:true, tactic:2},
];
// лимиты арсенала бота на бой: истребитель, штурмовик, торпедоносец, звено, бомбардировщик, атомный, ПВО, радар (+ мины 5, субмарина 1)
const BOT_LIMITS = [null,
  [0,0,1,0,1,0,0,0],[0,1,1,0,1,0,1,1],[1,1,2,1,2,0,2,1],[2,2,2,2,2,0,2,1],
  [2,2,2,2,2,0,3,1],[2,2,2,2,2,1,3,1],[2,2,2,2,2,1,3,1],[2,2,2,2,2,1,3,1]];
function botLimits(lvl){
  const a=BOT_LIMITS[lvl];
  return {fighter:a[0],assault:a[1],torpedo:a[2],pair:a[3],bomber:a[4],atomic:a[5],pvo:a[6],radar:a[7],mine:5,sub:1};
}

/* ---------- геометрия ударов ----------
   Поле игрока слева, поле противника справа. Самолёты летят горизонтально
   со стороны атакующего: на поле противника — слева направо, на поле игрока — справа налево. */
function clampZone(item,cx,cy){
  const a=ARS[item];
  if(item==='torpedo') return {x0:0,y0:Math.max(0,Math.min(N-1,cy))};
  return {x0:Math.max(0,Math.min(N-a.w, cx-Math.floor((a.w-1)/2))), y0:Math.max(0,Math.min(N-a.h, cy-Math.floor((a.h-1)/2)))};
}
function zoneCells(item,x0,y0){
  const a=ARS[item], c=[];
  for(let y=y0;y<y0+a.h;y++) for(let x=x0;x<x0+a.w;x++) c.push([x,y]);
  return c;
}
// «фюзеляж» — строки, над которыми проходит самолёт (по ним срабатывает ПВО)
function fuselage(h,y0){ return h%2 ? [y0+(h-1)/2] : [y0+h/2-1, y0+h/2]; }
function subOk(def,x0,y0){ return zoneCells('sub',x0,y0).every(([x,y])=>def.isFree(x,y)); }

/* ---------- применение ---------- */
// удар по клетке поля def; мина отвечает по клетке атакующего с теми же координатами
function hitCell(def,att,x,y,ev,torpedo){
  const k=Field.key(x,y);
  if(def.shot.has(k) || def.blocked.has(k)) return 'skip';
  if(def.mines.has(k)){
    def.shot.add(k); def.mines.delete(k); def.minesHit.add(k);
    ev.push({F:def,x,y,r:torpedo?'mineT':'mine'});
    if(!torpedo) selfCell(att,x,y,ev,true);
    return 'mine';
  }
  const r=def.fire(x,y); ev.push({F:def,x,y,r:r.res,ship:r.ship,around:r.around});
  return r.res;
}
// урон по своему полю (ответ мины, атомный взрыв у границы) — без цепной реакции
function selfCell(F,x,y,ev,backfire){
  const k=Field.key(x,y);
  if(F.shot.has(k) || F.blocked.has(k)) return;
  if(F.mines.has(k)){ F.shot.add(k); F.mines.delete(k); F.minesHit.add(k); ev.push({F,x,y,r:'mineSelf',backfire}); return; }
  const r=F.fire(x,y); ev.push({F,x,y,r:r.res,ship:r.ship,around:r.around,backfire});
}
// торпеда идёт по клеткам до первой палубы или мины
function torpedoRun(def,att,path,ev){
  const out=[];
  for(const [x,y] of path){
    const k=Field.key(x,y);
    if(def.shot.has(k) || def.blocked.has(k)){ out.push([x,y]); continue; }
    const r=hitCell(def,att,x,y,ev,true); out.push([x,y]);
    if(r!=='miss') break;
  }
  return out;
}
// ПВО: каждая полоса сбивает не больше одного самолёта за налёт
function pvoCheck(def,planes){
  const used=new Set();
  for(const p of planes){
    for(const r of p.fus){ const b=def.pvoAt(r); if(b!==undefined && !used.has(b)){ used.add(b); p.shot=true; p.band=b; def.pvoSeen.add(b); break; } }
  }
}

/* resolveWeapon — вся логика удара без анимации.
   side: 'me' (игрок бьёт по полю противника) или 'foe' (бот бьёт по полю игрока).
   Возвращает {item,x0,y0,planes,ev,paths,spotted,endTurn,border}. */
function resolveWeapon(att,def,item,cx,cy,side){
  const a=ARS[item]; const {x0,y0}=clampZone(item,cx,cy);
  const ev=[], res={item,x0,y0,planes:[],ev,paths:[],spotted:[],endTurn:!a.free,border:null};
  const dirR = side==='me';                         // торпеды/самолёты идут слева направо
  const rowPath=(y,xa,xb)=>{ const p=[]; if(dirR) for(let x=xa;x<=xb;x++) p.push([x,y]); else for(let x=xb;x>=xa;x--) p.push([x,y]); return p; };
  if(item==='radar'){
    for(const [x,y] of zoneCells(item,x0,y0)){ const k=Field.key(x,y); if(!def.shot.has(k) && def.shipAt(x,y)){ def.spotted.add(k); res.spotted.push([x,y]); } }
    return res;
  }
  if(item==='sub'){
    const cyy=y0+1, up=[], down=[];
    for(let y=cyy;y>=0;y--) up.push([x0,y]);
    for(let y=cyy+1;y<N;y++) down.push([x0,y]);
    const order=Math.random()<.5?[up,down]:[down,up];
    for(const p of order) res.paths.push(torpedoRun(def,att,p,ev));
    return res;
  }
  // авиация
  if(item==='pair') res.planes=[{fus:[y0],row:y0},{fus:[y0+1],row:y0+1}];
  else res.planes=[{fus:fuselage(a.h,y0), row:y0+(a.h-1)/2}];
  pvoCheck(def,res.planes);
  const P=res.planes[0];
  switch(item){
    case 'torpedo':
      if(!P.shot) res.paths.push(torpedoRun(def,att,rowPath(y0,0,N-1),ev));
      break;
    case 'pair':
      res.planes.forEach((p,i)=>{ if(!p.shot) res.paths.push(torpedoRun(def,att,rowPath(y0+i,x0,x0+a.w-1),ev)); });
      break;
    case 'fighter':
      if(!P.shot) for(const [x,y] of zoneCells(item,x0,y0)) hitCell(def,att,x,y,ev);
      break;
    case 'bomber':
      if(!P.shot){ const c=zoneCells(item,x0,y0).sort(()=>Math.random()-.5).slice(0,5); for(const [x,y] of c) hitCell(def,att,x,y,ev); }
      break;
    case 'assault': {
      // ракеты (2 клетки сверху и 2 снизу) долетают даже если самолёт сбит
      const top=rnd(0,1), bot=rnd(0,1);
      res.rockets=[[x0+top,y0],[x0+top+1,y0],[x0+bot,y0+3],[x0+bot+1,y0+3]];
      if(!P.shot) for(let y=y0+1;y<=y0+2;y++) for(let x=x0;x<x0+3;x++) hitCell(def,att,x,y,ev);
      for(const [x,y] of res.rockets) hitCell(def,att,x,y,ev);
      break; }
    case 'atomic':
      if(!P.shot){ for(const [x,y] of zoneCells(item,x0,y0)) hitCell(def,att,x,y,ev); }
      else {
        // сбитый атомный бомбардировщик падает у границы полей и задевает оба
        const r0=Math.max(0,P.fus[0]-2), r1=Math.min(N-1,P.fus[0]+2);
        const defCols = side==='me'?[0,1]:[N-2,N-1], attCols = side==='me'?[N-2,N-1]:[0,1];
        res.border={r0,r1};
        for(let y=r0;y<=r1;y++){ for(const x of defCols) hitCell(def,att,x,y,ev); for(const x of attCols) selfCell(att,x,y,ev,false); }
      }
      break;
  }
  return res;
}
// обычный выстрел (в расширенном режиме мина отвечает по стреляющему)
function resolveShot(att,def,x,y){
  const ev=[]; const r=hitCell(def,att,x,y,ev);
  return {ev, endTurn: r==='miss' || r==='mine'};
}

/* =========================================================
   ИИ — алгоритм из Sea Battle 2 (классический режим)
   ========================================================= */
class Bot {
  constructor(level,params){ this.lvl=level; this.p=params||AI_CLASSIC[level]; this.chance=this.p.chanceHit; this.killsInRow=0; this.lastWasCheat=false; }
  // field — поле ИГРОКА (бот «знает» его, как и в оригинале)
  chooseShot(f){
    const p=this.p;
    // 0. «небрежность» слабых капитанов: выстрел наугад
    if(p.sloppy && rnd(1,100)<=p.sloppy) return this.randomFree(f);
    // 1. добить раненого
    const wounded=f.ships.find(s=>!s.sunk && s.hits.size>0);
    if(wounded){
      const live=wounded.len-wounded.hits.size;
      const ch = live>=4?p.w4 : live===3?p.w3 : p.w2;
      const honest=this.plausibleNeighbour(f,wounded);
      if(rnd(0,100)<=ch || !honest) return this.randomLiveDeck(f,wounded);
      return honest;
    }
    // 2. свободный поиск
    let r=rnd(0,100);
    if(this.killsInRow>=p.deadInRow) r=this.chance*2+1;       // «подглядывать» запрещено
    if(r>this.chance){
      this.killsInRow=0; this.lastWasCheat=false;
      this.chance=Math.min(this.chance+p.step, p.max);
      return this.cellWhereLargestFits(f) || this.randomFree(f);
    }
    this.lastWasCheat=true;
    const cell=this.cheatHit(f);
    this.chance = rnd(0,100) > p.reset ? Math.min(this.chance+p.step,p.max) : p.chanceHit;
    return cell;
  }
  onSunkByBot(){ if(this.lastWasCheat) this.killsInRow++; }
  randomLiveDeck(f,s){ const c=s.cells.filter(([x,y])=>!f.shot.has(Field.key(x,y))); return pick(c); }
  plausibleNeighbour(f,s){
    const hits=s.cells.filter(([x,y])=>f.shot.has(Field.key(x,y)));
    let cand=[];
    if(hits.length>=2){
      const v=hits[0][0]===hits[1][0];
      const xs=hits.map(h=>v?h[1]:h[0]); const mn=Math.min(...xs), mx=Math.max(...xs);
      const fixed=v?hits[0][0]:hits[0][1];
      cand = v ? [[fixed,mn-1],[fixed,mx+1]] : [[mn-1,fixed],[mx+1,fixed]];
    } else {
      const [x,y]=hits[0]; cand=[[x-1,y],[x+1,y],[x,y-1],[x,y+1]];
    }
    cand=cand.filter(([x,y])=>inB(x,y)&&f.isFree(x,y));
    return cand.length?pick(cand):null;
  }
  cellWhereLargestFits(f){
    const alive=f.alive(); if(!alive.length) return null;
    const L=Math.max(...alive.map(s=>s.len));
    const cells=new Map();
    for(let y=0;y<N;y++) for(let x=0;x<N;x++) for(const v of [false,true]){
      const cs=f.cellsOf(L,x,y,v);
      if(cs.every(([cx,cy])=>inB(cx,cy)&&f.isFree(cx,cy))) cs.forEach(([cx,cy])=>cells.set(Field.key(cx,cy),[cx,cy]));
    }
    return cells.size?pick([...cells.values()]):null;
  }
  randomFree(f){ const a=[]; for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(f.isFree(x,y)) a.push([x,y]); return pick(a); }
  cheatHit(f){
    let alive=f.alive().filter(s=>s.hits.size===0);
    if(!alive.length) alive=f.alive();
    const big=alive.filter(s=>s.len>1);
    let pool = big.length && rnd(0,100) > this.p.oneDeck ? big : alive;
    return this.randomLiveDeck(f,pick(pool));
  }
}

/* ИИ расширенного режима: закупка, оборона, выбор и наведение оружия */
class BotAdv extends Bot {
  constructor(level){
    super(level, AI_ADVANCED[level]);
    this.inv={}; this.budget=pick([140,180,260]); this.avoidRows=new Set();
    const lim=botLimits(level), have={};
    let budget=this.budget;
    for(let guard=0;guard<100;guard++){
      const cand=ARS_ORDER.filter(k=>(have[k]||0)<lim[k] && ARS[k].price<=budget);
      if(!cand.length) break;
      const k=pick(cand); have[k]=(have[k]||0)+1; budget-=ARS[k].price;
    }
    this.defense={pvo:have.pvo||0, mine:have.mine||0};
    for(const k of ARS_ATTACK) if(have[k]) this.inv[k]=have[k];
  }
  hasAttack(){ return ARS_ATTACK.some(k=>this.inv[k]>0); }
  wantsArsenal(){ return this.hasAttack() && rnd(0,100)<=this.p.arsenal; }
  pickWeapon(){
    const has=k=>this.inv[k]>0;
    if(this.p.tactic===2){
      const t=['torpedo','sub'].filter(has); if(t.length) return pick(t);
      if(has('pair')) return 'pair';
      const r=['fighter','bomber','radar','atomic','assault'].filter(has); if(r.length) return pick(r);
    }
    return pick(ARS_ATTACK.filter(has));
  }
  // позиция с наибольшим числом необстрелянных клеток; авиация обходит известные полосы ПВО
  aim(item,f){
    const a=ARS[item]; let best=-1, opts=[];
    if(this.p.sloppy && rnd(1,100)<=this.p.sloppy){            // небрежное наведение — наугад
      for(let t=0;t<30;t++){ const cx=rnd(0,N-1), cy=rnd(0,N-1); const {x0,y0}=clampZone(item,cx,cy); if(item!=='sub' || subOk(f,x0,y0)) return [cx,cy]; }
    }
    const avoid = a.air && this.p.pvoMem ? this.avoidRows : null;
    if(item==='torpedo'){
      for(let y=0;y<N;y++){ if(avoid && avoid.has(y)) continue;
        let s=0; for(let x=0;x<N;x++) if(f.isFree(x,y)) s++;
        if(s>best){ best=s; opts=[[0,y]]; } else if(s===best) opts.push([0,y]); }
      return best>0 ? pick(opts) : null;
    }
    for(let y0=0;y0<=N-a.h;y0++) for(let x0=0;x0<=N-a.w;x0++){
      if(item==='sub' && !subOk(f,x0,y0)) continue;
      if(avoid){ const fus = item==='pair'?[y0,y0+1]:fuselage(a.h,y0); if(fus.some(r=>avoid.has(r))) continue; }
      let s=0;
      if(item==='sub'){ for(let y=0;y<N;y++) if(f.isFree(x0,y)) s++; }
      else for(const [x,y] of zoneCells(item,x0,y0)) if(f.isFree(x,y)) s++;
      if(s>best){ best=s; opts=[[x0,y0]]; } else if(s===best) opts.push([x0,y0]);
    }
    if(best<=0) return null;
    const [x0,y0]=pick(opts);
    // resolveWeapon ждёт «центр» зоны
    return [x0+Math.floor((a.w-1)/2), y0+Math.floor((a.h-1)/2)];
  }
  onPlanesShot(planes,f){ if(!this.p.pvoMem) return; for(const p of planes) if(p.shot){ this.avoidRows.add(p.band); this.avoidRows.add(p.band+1); } }
  chooseShot(f){
    // сначала — палубы, найденные радаром
    const sp=[...f.spotted].map(k=>[k%N,Math.floor(k/N)]).filter(([x,y])=>!f.shot.has(Field.key(x,y)));
    if(sp.length) return pick(sp);
    return super.chooseShot(f);
  }
}

function buildBoard(wrap, cls){
  wrap.innerHTML='';
  const top=document.createElement('div'); top.className='labels-top'; top.innerHTML='<span></span>'+[...Array(10)].map((_,i)=>`<span>${i+1}</span>`).join('');
  const left=document.createElement('div'); left.className='labels-left'; left.innerHTML='<span></span>'+L().letters.map(l=>`<span>${l}</span>`).join('');
  const corner=document.createElement('div');
  const board=document.createElement('div'); board.className='board '+cls;
  const grid=document.createElement('div'); grid.className='grid'; board.appendChild(grid);
  const cells=[];
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const c=document.createElement('div'); c.className='cell free'; c.style.left=(x*10)+'%'; c.style.top=(y*10)+'%';
    c.dataset.x=x; c.dataset.y=y; grid.appendChild(c); cells.push(c);
  }
  wrap.append(corner, top, left, board);
  return {board, grid, cells, cell:(x,y)=>cells[y*N+x]};
}
function shipEl(len, v, state){

/* Высота экрана в px (iOS Safari и iframe Пикабу): 100vh там больше видимой области.
   После поворота и после экранной клавиатуры iOS оставляет страницу прокрученной —
   из-за этого касания «съезжали» относительно кнопок. Возвращаем прокрутку в ноль. */
function fixViewport(){
  const h=(window.visualViewport && window.visualViewport.height) || window.innerHeight;
  document.documentElement.style.setProperty('--vh', Math.round(h)+'px');
  if(window.scrollX||window.scrollY) window.scrollTo(0,0);
  document.documentElement.scrollTop=0; document.body.scrollTop=0;
}
fixViewport();
window.addEventListener('resize',fixViewport);
window.addEventListener('orientationchange',()=>{ fixViewport(); setTimeout(fixViewport,250); setTimeout(fixViewport,700); });
if(window.visualViewport) window.visualViewport.addEventListener('resize',fixViewport);
document.addEventListener('focusout',()=>setTimeout(fixViewport,60));
window.addEventListener('scroll',()=>{ if(window.scrollY) window.scrollTo(0,0); },{passive:true});
/* iOS «пружинит» весь экран при протягивании пальцем. Разрешаем движение только внутри
   блока, который действительно прокручивается (список рейтинга, магазин и т.п.) и только пока ему есть куда ехать. */
(function(){
  let sy=0, sx=0;
  const scroller=el=>{ for(; el && el!==document.body; el=el.parentElement){
      const cs=getComputedStyle(el);
      if(/(auto|scroll)/.test(cs.overflowY) && el.scrollHeight>el.clientHeight+1) return el;
      if(/(auto|scroll)/.test(cs.overflowX) && el.scrollWidth>el.clientWidth+1) return el; }
    return null; };
  document.addEventListener('touchstart',e=>{ if(e.touches.length===1){ sy=e.touches[0].clientY; sx=e.touches[0].clientX; } },{passive:true});
  document.addEventListener('touchmove',e=>{
    if(e.touches.length!==1) return;
    const t=e.touches[0], dy=t.clientY-sy, dx=t.clientX-sx, el=scroller(e.target);
    if(!el){ e.preventDefault(); return; }
    if(Math.abs(dy)>=Math.abs(dx)){
      const top=el.scrollTop<=0, bottom=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
      if((top && dy>0) || (bottom && dy<0)) e.preventDefault();
    }
  },{passive:false});
})();

/* ---------- Пикабу Игры: SDK и покупка энергии ----------
   SDK работает только на странице игры на games.pikabu.ru (игра открыта у них во фрейме) и в тестовой среде Студии.
   Товары создаются в Студии → «Внутриигровые товары» с ровно такими id, тип — «расходуемый». Цены задаются там же,
   в игре показываются цены из каталога. */
const ENERGY_PRODUCTS = {energy_1000:1000, energy_3000:3000, energy_5000:5000};
const PURCHASE_VERIFY_URL = '';        // адрес своего сервера проверки покупок; пусто — энергия начисляется в игре
const PKB = {sdk:null, products:[], started:false, cloudReady:false};
function onPikabu(){ try{ return window.self!==window.top || /pikabu\.ru$/.test(location.hostname) || /[?&]pikabu=1/.test(location.search); }catch(e){ return true; } }
function loadPikabu(){
  return new Promise(res=>{
    const init=async()=>{ try{ res(await Promise.race([PkbSDK.init(), new Promise((_,r)=>setTimeout(()=>r('timeout'),6000))])); }catch(e){ res(null); } };
    if(window.PkbSDK) return init();
    if(!onPikabu()) return res(null);
    const sc=document.createElement('script'); sc.src='https://games.pikabu.ru/sdk/sdk.js'; sc.async=true;
    sc.onload=init; sc.onerror=()=>res(null); document.head.appendChild(sc);
  });
}
const progressOf = o => [o && o.battles||0, o && o.xp||0, o && o.ts||0];
const moreProgress = (a,b) => { const x=progressOf(a), y=progressOf(b); for(let i=0;i<3;i++){ if(x[i]!==y[i]) return x[i]>y[i]; } return false; };
const LOCAL_ONLY=['sound','music','lang','prologueSeen'];               // настройки устройства не переносятся
function pkbCloudMerge(sdk){
  let cs=null, ca=null;
  try{ cs=sdk.storage.get(PKB_SAVE); ca=sdk.storage.get(PKB_AUTH); }catch(e){ console.warn(e); }
  const useCloud = cs && typeof cs==='object' && (cs.name || cs.battles) && (!save.name || moreProgress(cs,save));
  if(useCloud){
    const keep={}; for(const k of LOCAL_ONLY) if(save[k]!==undefined) keep[k]=save[k];
    for(const k of Object.keys(save)) if(!(k in cs) && !LOCAL_ONLY.includes(k)) delete save[k];
    Object.assign(save, cs, keep);
    if(ca && ca.uid){                                                    // тот же аккаунт рейтинга, что и на другом устройстве
      try{ localStorage.setItem('locia.auth',JSON.stringify(ca)); }catch(e){}
      Cloud.auth=ca; Cloud.token=null; Cloud.exp=0; Cloud.uid=ca.uid;
    }
    try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){}
    LANG = save.lang || LANG;
  }
  PKB.cloudReady=true;
  pkbStore();                                                            // облако = текущий прогресс
  if(!useCloud || !(ca && ca.uid)){ Cloud.loadAuth(); if(Cloud.auth) pkbStoreAuth(Cloud.auth); }
  return useCloud;
}
function pkbPlayerName(){
  try{ const p=PKB.sdk && PKB.sdk.player; if(!p || !p.isAuthorized) return '';
    const n=normName(String(p.name||'').replace(/[^\p{L}\p{N}_\- ]/gu,'')).slice(0,16).trim();
    return NAME_RE.test(n) ? n : ''; }catch(e){ return ''; }
}
async function pkbInit(){
  const sdk=await loadPikabu(); if(!sdk) return;
  PKB.sdk=sdk; window.PKB=PKB;
  if(sdk.storage) pkbCloudMerge(sdk);
  try{ sdk.on && sdk.on('storageSaveError',e=>console.warn('pkb save',e)); }catch(e){}
  document.addEventListener('visibilitychange',()=>{ if(document.hidden && PKB.cloudReady){ try{ sdk.storage.flush(); }catch(e){} } });
  if(introDone && !PKB.started){ PKB.started=true; try{ sdk.gameStarted(); }catch(e){} }
  try{ PKB.products=(await sdk.store.getProducts()).filter(p=>ENERGY_PRODUCTS[p.id]); }catch(e){ PKB.products=[]; }
  // незавершённые покупки (например, закрыли вкладку после оплаты) — начислить сейчас
  try{ for(const pu of await sdk.store.getPurchases()) if(pu.isConsumable && ENERGY_PRODUCTS[pu.productId]) await grantPurchase(pu,true); }catch(e){ console.warn(e); }
  if($('menu').classList.contains('on')) renderMenu();
}
function pkbGameStarted(){ if(PKB.sdk && !PKB.started){ PKB.started=true; try{ PKB.sdk.gameStarted(); }catch(e){} } }
async function grantPurchase(pu,silent){
  const add=ENERGY_PRODUCTS[pu.productId]; if(!add) return false;
  save.pkbDone=save.pkbDone||[];
  if(!save.pkbDone.includes(pu.purchaseId)){            // защита от повторного начисления одной покупки
    if(PURCHASE_VERIFY_URL){
      try{ const r=await fetch(PURCHASE_VERIFY_URL,{method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({signedData:await pu.getSignedData(), uid:Cloud.uid||''})});
           const j=await r.json(); if(!j.success) return false; }
      catch(e){ console.warn(e); return false; }
    }
    energyNow(); save.energy+=add; if(save.energy>=maxEnergy()) save.energyTs=Date.now();
    save.pkbDone=[...save.pkbDone,pu.purchaseId].slice(-50);
    commitProgress(); renderHud(); updatePlayBtn();
    if(!silent){ SFX.win(); toast(T('enBought',add)); }

  try{ await PKB.sdk.store.consumePurchase(pu.purchaseId); }catch(e){ console.warn(e); }

  const val = field==='xp' ? `${li.L}<small>${p.xp||0} ${T('xpShort')}</small>` : (p[field]||0);
  const sub = field==='xp' ? `${p.points||0} ${T('ptsShort')}` : `${T('lvlWord')} ${li.L}`;

    <div class="rk"><img src="${rankImg(ri)}" title="${escapeHtml(L().ranks[ri])}" alt=""></div><div class="vl">${val}</div></div>`;
}
const meRow = () => ({name:save.name,points:save.points,wins:save.wins,xp:save.xp,av:save.av});
function escapeHtml(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function openLeaders(tab){
